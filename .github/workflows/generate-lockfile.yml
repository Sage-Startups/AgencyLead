name: Generate lockfile

# Manual, one-shot helper: regenerates package-lock.json on a runner and
# commits it. Removed once it has served its purpose.
on:
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Refresh package-lock.json (adds stripe)"
            git push
          else
            echo "No lockfile change to commit."
          fi
