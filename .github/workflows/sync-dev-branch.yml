name: Sync dev branch to main

# Manual, one-shot helper. The development branch is an ancestor of main, so
# this is a plain fast-forward and cannot discard history. Removed after use.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward dev branch to main
        run: |
          BRANCH=claude/compassionate-hamilton-0s63hu
          git fetch origin main "$BRANCH"

          # Refuse to proceed unless this is a genuine fast-forward.
          if git merge-base --is-ancestor "origin/$BRANCH" origin/main; then
            echo "origin/$BRANCH is an ancestor of main - fast-forwarding."
            git push origin origin/main:refs/heads/$BRANCH
          else
            echo "origin/$BRANCH has commits not on main. Refusing to force-update."
            exit 1
          fi
